<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Design Workshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header class="bg-dark text-white py-5">
    <div class="container">
      <span class="badge text-bg-warning mb-2">Free workshop</span>
      <h1 class="display-5 fw-bold">Web Design Workshop</h1>
      <p class="lead mb-0">Build your first responsive webpage with HTML and Bootstrap.</p>
    </div>
  </header>

  <main class="bg-light py-5">
    <div class="container">
      <div class="row g-4 align-items-start">

        <!-- Left card: dl list instead of nested divs -->
        <div class="col-md-5">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title h4 mb-3">Workshop details</h2>
              <dl class="mb-0">
                <dt>Day</dt>
                <dd>Saturday</dd>
                <dt>Location</dt>
                <dd>School computer lab</dd>
                <dt>What to bring</dt>
                <dd class="mb-0">A laptop and charger</dd>
              </dl>
            </div>
          </div>
        </div>

        <!-- Right card: flex column + gap instead of mb-3 everywhere -->
        <div class="col">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title h4 mb-3">Register for a session</h2>

              <form class="d-flex flex-column gap-3">
                <div>
                  <label for="fullName" class="form-label">Full name</label>
                  <input type="text" class="form-control" id="fullName">
                </div>

                <div>
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email">
                </div>

                <fieldset>
                  <legend class="fs-6 fw-bold mb-1">Choose a session</legend>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="session" id="morning">
                    <label class="form-check-label" for="morning">Morning · 9:00–11:00 AM</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="session" id="afternoon">
                    <label class="form-check-label" for="afternoon">Afternoon · 2:00–4:00 PM</label>
                  </div>
                </fieldset>

                <div>
                  <button type="submit" class="btn btn-primary">Register</button>
                </div>
                <small class="text-body-secondary">Practice form. Entries are discarded.</small>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
